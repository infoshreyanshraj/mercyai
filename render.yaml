services:
  - type: web
    name: mercy-ai-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://infoshreyanshraj.github.io
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini